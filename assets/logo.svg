         cy="100"
         r="100"
         id="circle13" />
    </clipPath>
    <!-- INNER ORBIT BRANCH (Radius = 48) -->
    <g
       id="inner-branch">
      <path
         d="M 100,52 A 48,48 0 0,1 134,134"
