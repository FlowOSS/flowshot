      <stop
         offset="0%"
         stop-color="#FFFFFF"
         stop-opacity="1"
         id="stop9" />
      <stop
         offset="55%"
         stop-color="#FFFFFF"
         stop-opacity="0.85"
         id="stop10" />
      <stop
         offset="85%"
         stop-color="#FFFFFF"
         stop-opacity="0.25"
         id="stop11" />
      <stop
         offset="98%"
         stop-color="#FFFFFF"
         stop-opacity="0"
         id="stop12" />
      <stop
