     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg21" />
  <defs
     id="defs15">
    <!-- Inkscape & sRGB Compatible Color Gradient -->
    <linearGradient
       id="bg-grad"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%"
       color-interpolation="sRGB">
      <stop
         offset="0%"
         stop-color="#9333EA"
         id="stop1" />
      <!-- Rich Amethyst Purple -->
      <stop
         offset="45%"
         stop-color="#6D28D9"
         id="stop2" />
      <!-- Deep True Violet -->
      <stop
         offset="100%"
         stop-color="#0891B2"
         id="stop3" />
      <!-- Deep Cyan -->
    </linearGradient>
    <!-- Inner Orbit Gradient with sRGB color interpolation -->
    <linearGradient
       id="inner-white-fade"
       gradientUnits="userSpaceOnUse"
       x1="100"
       y1="52"
       x2="142"
       y2="142"
       color-interpolation="sRGB">
      <stop
         offset="0%"
         stop-color="#FFFFFF"
         stop-opacity="1"
         id="stop4" />
      <stop
         offset="55%"
         stop-color="#FFFFFF"
         stop-opacity="0.85"
         id="stop5" />
      <stop
         offset="85%"
         stop-color="#FFFFFF"
         stop-opacity="0.25"
         id="stop6" />
      <stop
         offset="98%"
         stop-color="#FFFFFF"
         stop-opacity="0"
         id="stop7" />
      <stop
         offset="100%"
         stop-color="#FFFFFF"
         stop-opacity="0"
         id="stop8" />
    </linearGradient>
    <!-- Outer Orbit Gradient with sRGB color interpolation -->
    <linearGradient
