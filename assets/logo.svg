       fill="#ffffff"
       opacity="0.22"
       id="path17" />
  </g>
  <!-- CENTER CORE (Camera Lens / Shot) -->
  <circle
     cx="100"
     cy="100"
     r="22"
     fill="none"
     stroke="#FFFFFF"
     stroke-width="2"
     opacity="0.3"
     id="circle17" />
  <circle
     cx="100"
     cy="100"
     r="13"
     fill="#FFFFFF"
     id="circle18" />
  <!-- PERPENDICULAR 90° GAP GEOMETRY -->
  <!-- Inner Orbit Pair -->
  <use
     href="#inner-branch"
     id="use18" />
  <use
     href="#inner-branch"
     transform="rotate(180 100 100)"
     id="use19" />
  <!-- Outer Orbit Pair (Rotated 90° for Perpendicular Alignment) -->
  <use
     href="#outer-branch"
     transform="rotate(90 100 100)"
     id="use20" />
  <use
     href="#outer-branch"
     transform="rotate(270 100 100)"
     id="use21" />
