         fill="none"
         stroke="url(#outer-white-fade)"
         stroke-width="8"
         stroke-linecap="round"
         id="path14" />
      <circle
         cx="100"
         cy="26"
         r="8.5"
         fill="#FFFFFF"
         id="circle15" />
