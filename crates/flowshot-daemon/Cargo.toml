[package]
name = "flowshot-daemon"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository = "https://github.com/flowoss/flowshot"
authors = ["FlowShot Contributors"]

[lib]
name = "flowshot_daemon"
path = "src/lib.rs"

# Helper binary: supervised foreground daemon (`flowshot daemon` in todo 35's
# CLI calls into this crate's library). Named flowshot-daemon, NOT flowshot:
# the `flowshot` binary name belongs to flowshot-cli (fixes the pre-existing
# output-filename collision between the two placeholder bins).
[[bin]]
name = "flowshot-daemon"
path = "src/main.rs"

[features]
# sd_notify(3) READY=1 handshake for systemd user units. Amendment #3: the
# daemon is INIT-AGNOSTIC - systemd is optional, never a hard dependency
# (OpenRC/runit/s6/shepherd = packaging roadmap, todo 42).
systemd = []
# Todo 38 headless execution mode: forwards to flowshot-ui's test-drive
# injector so the e2e harness drives OverlayCore through the production
# funnel without a window (examples/e2e_headless.rs).
test-drive = ["flowshot-ui/test-drive"]

[dependencies]
flowshot-core = { path = "../flowshot-core" }
flowshot-actions = { path = "../flowshot-actions" }
# Shared `DesktopEnv` vocabulary for the todo-34 shortcut-fallback selection
# (lightweight workspace member; zero new external crates - all of its deps
# are already in this crate's graph).
flowshot-capture = { path = "../flowshot-capture" }
# Todo 33: the tray's per-monitor submenu live-probes outputs through
# `CaptureThread` (the todo-6 registry probe - no GPU, no capture session;
# a dedicated wayland connection bounded by 10 s deadlines). Workspace
# member edge only: zero new external crates in the lock.
flowshot-capture-wayland = { path = "../flowshot-capture-wayland" }
# X11 Phase A (plan decision #7): the session-routed X11 capture leg
# (probe_x11 + X11Backend) in execute/backend.rs. Sibling of
# flowshot-capture-wayland; workspace member edge only (x11rb is already
# locked via flowshot-actions' X11 clipboard).
flowshot-capture-x11 = { path = "../flowshot-capture-x11" }
# Todo 38 executor: the overlay/pin/launcher/settings window runtimes, the
# completion export boundary, and the launch vocabulary. The daemon is the
# platform-integration layer (it already carries the wayland capture crates),
# so the ui edge violates no purity gate (gates cover core/capture/ui only).
flowshot-ui = { path = "../flowshot-ui" }
# ExportedImage -> DynamicImage for the actions pipeline (todo 29 entry point).
image = { workspace = true }
# WindowCustomizer app_id hooks (pins/launcher/settings windows, todos 30/36/37).
winit = { workspace = true }
# The headless execution mode's GPU context (feature test-drive; already in
# the graph via flowshot-ui).
wgpu = { workspace = true }
# EXECUTOR DECISION (todo 32, restated for zbus 5 - source-verified in
# 5.19 abstractions/mod.rs `use_tokio`): zbus 5 compiles BOTH reactors here
# (default async-io + tokio unified in via ashpd) and picks PER CONNECTION at
# build time: built inside a tokio runtime -> tokio reactor (internal tasks
# ride that runtime, die with it); built outside -> the zbus-4 model (private
# async-executor + dedicated driver thread, futures drivable from ANY
# executor). The daemon's own bus is built inside the daemon's tokio runtime,
# so it rides the tokio reactor; the p2p test stubs pin the async-io reactor
# via Builder::async_io_unix_stream. Teardown discipline UNCHANGED (todo 11):
# the async-io reactor has NO drop-time close - the daemon calls
# Connection::close() explicitly on shutdown and stub harnesses close both
# ends; on the tokio reactor close() stays the deterministic release and
# runtime teardown is the backstop.
zbus = { workspace = true, features = ["p2p"] }
notify-rust = { workspace = true }
# OpenURI portal for notification click actions (todo-29/31 pattern), the
# GlobalShortcuts portal client (todo 34), and the Settings portal color-scheme
# query. ashpd 0.13 gates every portal behind its own feature (default = tokio
# reactor only). PINNED API REALITY (0.13.13, source-verified): GlobalShortcuts
# has NO restore_token/persist_mode (unlike ScreenCast) and exposes neither the
# session handle nor the handle tokens (pub(crate)) - "restore data" is
# therefore the re-registration set, see src/shortcut.rs module docs. The
# session-bus connection is a process-global OnceLock singleton (proxy.rs
# `static SESSION`) - correct in production, and the reason the stub-portal
# test drives it through DBUS_SESSION_BUS_ADDRESS.
ashpd = { workspace = true, features = ["global_shortcuts", "open_uri", "settings"] }
# Restore-data persistence (JSON in the config dir) + `StreamExt` for the
# portal's Activated signal stream (todo 34). Both pre-locked workspace deps.
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
# Member-manifest addition (todo-31 `url` precedent; already locked - the
# actions crate depends on it too).
url = "2.5"
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Opt-in error telemetry (root-table pin; the daemon is the shell/platform
# boundary, so the gated crates stay pure). Initialized ONLY when
# [telemetry].enabled - a disabled config never constructs a client,
# transport, or thread. DSN is a build-time constant in src/telemetry.
sentry = { workspace = true }
# Binary-layer only: logging init + top-level error reporting (Amendment #4).
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
clap = { workspace = true }

[build-dependencies]
# Build-time tray-logo rasterization (assets/logo.svg -> the SNI pixmap
# sizes; the flowshot-ui icon-atlas build.rs precedent). Workspace pin,
# already in the lock - zero new external crates, and build-only: the
# binary embeds the ~18 KB of pixmaps, never the rasterizer.
resvg = { workspace = true }

[dev-dependencies]
# The e2e_headless harness builds synthetic capture frames (already locked
# via flowshot-capture).
bytes = { workspace = true }
# Todo 38 flow 9: the upload wiremock e2e (the todo-31 test pattern).
wiremock = { workspace = true }
# The tray-icon determinism test re-rasterizes assets/logo.svg through the
# shared build-time function (logo_raster.rs) and compares it against the
# embedded bytes (same workspace pin the build script uses).
resvg = { workspace = true }

[[example]]
name = "e2e_headless"
required-features = ["test-drive"]

[lints]
workspace = true
