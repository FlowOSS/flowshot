[package]
name = "flowshot-capture-wayland"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository = "https://github.com/flowoss/flowshot"
authors = ["FlowShot Contributors"]

[lib]
crate-type = ["rlib"]

[dependencies]
flowshot-core = { path = "../flowshot-core" }
flowshot-capture = { path = "../flowshot-capture" }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
calloop = { workspace = true }
calloop-wayland-source = { workspace = true }
# ashpd 0.13 gates every portal behind its own feature (default = tokio
# reactor only); this crate drives the two capture portals.
ashpd = { workspace = true, features = ["screenshot", "screencast"] }
# ashpd 0.13 replaced `url::Url` with its own minimal `Uri` (no
# `to_file_path`), so the Screenshot portal's `file:` URI is decoded
# through `url` (member-manifest addition, daemon/actions precedent;
# already locked - zero new external crates).
url = "2.5"
pipewire = { workspace = true }
# `p2p` enables the private peer-to-peer connection builder the KWin
# ScreenShot2 stub tests run on (hermetic unit tests, no session bus).
zbus = { workspace = true, features = ["p2p"] }
tokio = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
image = { workspace = true }
nix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
