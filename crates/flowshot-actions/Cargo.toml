[package]
name = "flowshot-actions"
version.workspace = true
edition = "2024"
license.workspace = true
repository = "https://github.com/flowoss/flowshot"
authors = ["FlowShot Contributors"]

[lib]
crate-type = ["rlib"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dependencies]
flowshot-core = { path = "../flowshot-core" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
image = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "multipart"] }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
url = "2.5"

[target.'cfg(unix)'.dependencies]
wl-clipboard-rs = { workspace = true }
# ashpd 0.13 gates every portal behind its own feature; this crate drives
# OpenURI only (open-with action + Imgur delete URL).
ashpd = { workspace = true, features = ["open_uri"] }
x11rb = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
