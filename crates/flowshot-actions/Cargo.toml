[package]
name = "flowshot-actions"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository = "https://github.com/flowoss/flowshot"
authors = ["FlowShot Contributors"]

[lib]
crate-type = ["rlib"]

[dependencies]
flowshot-core = { path = "../flowshot-core" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
image = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "multipart"] }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
wl-clipboard-rs = { workspace = true }
ashpd = { workspace = true }
rfd = { workspace = true }
url = "2.5"

[dev-dependencies]
wiremock = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
