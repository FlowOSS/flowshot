[package]
name = "flowshot-ui"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository = "https://github.com/flowoss/flowshot"
authors = ["FlowShot Contributors"]

[lib]
crate-type = ["rlib"]

[features]
# Public synthetic-input seam (`OverlayCore::inject_event`, `OverlayHandle::inject_event`)
# so mouse paths are QA-able without ydotool.
test-drive = []
# Live frame-timing profiler (the interactive-freeze diagnosis): per-window
# display-list build / tessellate+shape / encode+submit / present-overhead
# breakdown with p50/p95/p99 aggregates emitted over tracing every N frames,
# plus the redraw rate. Compiled OUT by default - production carries zero
# instrumentation overhead (the profiler module and every record site are
# `#[cfg(feature = "perf-trace")]`).
perf-trace = []

[dependencies]
flowshot-core = { path = "../flowshot-core" }
# The UI talks ONLY to the platform-free capture contract crate
# (Frame/CaptureBackend/CaptureOpts) - never to the platform capture crate
# (purity gate).
flowshot-capture = { path = "../flowshot-capture" }
winit = { workspace = true }
wgpu = { workspace = true }
# Only `futures::executor::block_on` is used: the one-shot wgpu adapter/device
# request at startup. (Workspace inheritance forbids `default-features = false`
# overrides, so the full crate is inherited.)
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# Renderer stack: lyon tessellation + cosmic-text shaping/rasterization
# (single text stack via cosmic-text's SwashCache; no glyphon - see the root
# Cargo.toml note: no glyphon release pairs with the wgpu 0.20 pin).
cosmic-text = { workspace = true }
lyon = { workspace = true }
bytemuck = { workspace = true }

# Settings surface: egui embedded in OUR wgpu renderer -
# the single recorded exception to the winit+wgpu+cosmic-text stack (settings
# window ONLY - never the overlay/editor). egui-wgpu 0.36 requires wgpu 30 =
# the workspace pin and pairs with winit 0.30.13 (crates.io-verified).
# egui-winit is deliberately NOT used: the hand-feed bridge (egui_host::input)
# is the tested surface - egui_wgpu is fed manually from our own winit 0.30
# input router (recorded migration decision). Workspace inheritance forbids
# default-features overrides, so egui's embedded default fonts
# (epaint_default_fonts) come along unused (the vendored Inter replaces them
# at runtime; the orchestrator can trim them with default-features=false in
# the ROOT table if size matters).
egui = { workspace = true }
egui-wgpu = { workspace = true }
# Filename-pattern live preview in the settings Filename tab (same strftime
# subset as flowshot-actions' export expander; the actions crate is not a lib
# dependency - purity gate).
chrono = { workspace = true }

[dev-dependencies]
# QA-harness composition only (examples/pin_window.rs is the reference
# PinActionSink bridge): the LIB never imports the Wayland-native actions
# crate (purity gate) - the real bridge lives in the binary layer.
flowshot-actions = { path = "../flowshot-actions" }
# QA-harness composition only (examples/launcher_dialog.rs executes the
# dialog's typed request against the live session for the QA acceptance:
# probe for the monitor dropdown + capture_region for the saved-image
# assert). The LIB keeps the MonitorProbe/LaunchCallback seams instead -
# the production wiring lives in the binary layer (purity gate).
flowshot-capture-wayland = { path = "../flowshot-capture-wayland" }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
bytes = { workspace = true }
serde_json = { workspace = true }
# DEV-ONLY reference rasterizer for the cross-rasterizer parity harness and
# golden fixtures.
tiny-skia = { workspace = true }
# PNG encode/decode for parity evidence dumps in tests/examples only.
image = { workspace = true }

[lints]
workspace = true

[build-dependencies]
resvg = { workspace = true }

[[example]]
name = "qa_bundle"
required-features = ["test-drive"]

[[example]]
name = "perf_storm"
required-features = ["test-drive"]

[[example]]
name = "discoverability"
required-features = ["test-drive"]

[[example]]
name = "wheel_sizing"
required-features = ["test-drive"]
