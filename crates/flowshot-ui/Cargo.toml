[package]
name = "flowshot-ui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flowoss/flowshot"
authors = ["FlowShot Contributors"]

[lib]
crate-type = ["rlib"]

[features]
# Public synthetic-input seam (`OverlayCore::inject_event`, `OverlayHandle::inject_event`)
# so mouse paths are QA-able without ydotool (plan todo 13, Metis blocker #1 fallback).
test-drive = []

[dependencies]
flowshot-core = { path = "../flowshot-core" }
# Todo 15: the UI talks ONLY to the platform-free capture contract crate
# (Frame/CaptureBackend/CaptureOpts) - never to the platform capture crate
# (purity gate, plan todo 13/42).
flowshot-capture = { path = "../flowshot-capture" }
winit = { workspace = true }
wgpu = { workspace = true }
# Only `futures::executor::block_on` is used: the one-shot wgpu adapter/device
# request at startup. (Workspace inheritance forbids `default-features = false`
# overrides, so the full crate is inherited.)
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# Todo 14 renderer stack: lyon tessellation + cosmic-text shaping/rasterization
# (single text stack via cosmic-text's SwashCache; no glyphon - see the root
# Cargo.toml note: no glyphon release pairs with the wgpu 0.20 pin).
cosmic-text = { workspace = true }
lyon = { workspace = true }
bytemuck = { workspace = true }

# egui enters with todo 36 version-matched to the winit pin (plan dep
# guardrail); keeping it out avoids duplicate winit/wgpu majors in the lockfile
# (deny.toml bans version drift).

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter"] }
bytes = { workspace = true }
serde_json = { workspace = true }
# DEV-ONLY reference rasterizer for the cross-rasterizer parity harness and
# golden fixtures (Oracle r4 F-1: never a runtime CPU fallback).
tiny-skia = { workspace = true }
# PNG encode/decode for parity evidence dumps in tests/examples only.
image = { workspace = true }

[lints]
workspace = true

[build-dependencies]
resvg = { workspace = true }
