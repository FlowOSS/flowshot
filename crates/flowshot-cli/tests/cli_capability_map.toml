# FlowShot CLI capability map (plan todo 35; replaces the Flameshot
# parity-diff per User Amendment #2: CAPABILITY parity is kept, INTERFACE
# parity is deliberately dropped).
#
# Every row is one Flameshot CLI capability from the draft F12 inventory
# (verbs, per-subcommand flags, CLI-reachable capture modes; source:
# flameshot.org/docs/advanced/commandline-options + the F12 lane-1 sweep).
# Each row is either:
#   disposition = "mapped"  + argv = [...]  (must parse through the
#                           flowshot clap surface - enforced by
#                           tests/capability_map.rs, runs in CI)
#   disposition = "dropped" + reason = "..." (explicit product decision)
# Zero unmapped rows allowed. Todo 38's parity_matrix.toml REFERENCES these
# row ids instead of duplicating dispositions (Momus r4 single-source rule).

# ---- verbs (F12: CLI gui/full/screen/launcher/config) ----

[[capability]]
id = "verb-gui"
flameshot = "gui"
disposition = "mapped"
argv = ["capture"]
note = "the `gui` verb itself is rejected with a did-you-mean hint; the capability (interactive region capture + editor) is the bare command"

[[capability]]
id = "verb-full"
flameshot = "full"
disposition = "mapped"
argv = ["capture", "full"]

[[capability]]
id = "verb-screen"
flameshot = "screen"
disposition = "mapped"
argv = ["capture", "screen"]
note = "top-level `screen` verb rejected with hint; capability lives under capture"

[[capability]]
id = "verb-launcher"
flameshot = "launcher"
disposition = "mapped"
argv = ["capture", "--dialog"]
note = "top-level `launcher` verb rejected with hint"

[[capability]]
id = "verb-config"
flameshot = "config"
disposition = "mapped"
argv = ["settings"]
note = "`config` also works as a visible alias of `settings`"

# ---- gui/full/screen flags (F12 flag inventory) ----

[[capability]]
id = "flag-path"
flameshot = "-p/--path"
disposition = "mapped"
argv = ["capture", "-o", "/tmp/captures"]
note = "renamed to -o/--output (file OR dir, same semantics)"

[[capability]]
id = "flag-clipboard"
flameshot = "-c/--clipboard"
disposition = "mapped"
argv = ["capture", "-c"]

[[capability]]
id = "flag-delay"
flameshot = "-d/--delay"
disposition = "mapped"
argv = ["capture", "-d", "2000"]

[[capability]]
id = "flag-region"
flameshot = "--region <WxH+X+Y|string>"
disposition = "mapped"
argv = ["capture", "--region", "640x480+10+20"]
note = "grammar WxH[+X+Y]|at-cursor per Oracle r4; offset-less WxH centers at the cursor (todo 18)"

[[capability]]
id = "flag-last-region"
flameshot = "--last-region"
disposition = "mapped"
argv = ["capture", "--last-region"]

[[capability]]
id = "flag-raw"
flameshot = "-r/--raw"
disposition = "mapped"
argv = ["capture", "--raw"]
note = "PNG to stdout; forces the in-process one-shot mode (stdout never routes over D-Bus)"

[[capability]]
id = "flag-print-geometry"
flameshot = "-g/--print-geometry"
disposition = "mapped"
argv = ["capture", "--print-geometry"]

[[capability]]
id = "flag-upload"
flameshot = "-u/--upload"
disposition = "mapped"
argv = ["capture", "--upload"]
note = "empty [upload].client_id -> exit 2 with a settings hint (Amendment #3: no shared default client-id)"

[[capability]]
id = "flag-pin"
flameshot = "--pin"
disposition = "mapped"
argv = ["capture", "--pin"]

[[capability]]
id = "flag-accept-on-select"
flameshot = "-s/--accept-on-select"
disposition = "mapped"
argv = ["capture", "--instant"]

[[capability]]
id = "flag-screen-number"
flameshot = "screen -n/--number"
disposition = "mapped"
argv = ["capture", "screen", "1"]
note = "index or connector name; no argument = the output under the cursor"

