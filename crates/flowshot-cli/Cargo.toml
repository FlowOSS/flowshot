[package]
name = "flowshot-cli"
version.workspace = true
edition = "2024"
license.workspace = true
repository = "https://github.com/flowoss/flowshot"
authors = ["FlowShot Contributors"]
description = "Screenshot and annotation tool for Linux desktops"

# Library + thin binary split (anyhow only at the binary top
# level; the clap surface, dispatch, and wire mapping live in the lib so the
# daemon-side argv re-parse and the tests reuse the same types).
[lib]
name = "flowshot_cli"
path = "src/lib.rs"

[[bin]]
name = "flowshot"
path = "src/main.rs"

[dependencies]
flowshot-core = { path = "../flowshot-core" }
# The wire seam: CaptureRequest/CAPTURE_OPTION_KEYS (wire vocabulary),
# the instance handshake primitives, the Daemon composition root, paths,
# and the bind-help source for --print-bind-help.
flowshot-daemon = { path = "../flowshot-daemon" }

# Same executor decision as the daemon crate: the CLI
# drives zbus futures from its own tokio runtime, so its connections ride
# zbus-5's tokio reactor; connections are still closed explicitly (the
# async-io reactor path has no drop-time close).
zbus = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_complete_nushell = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Binary-layer logging init.
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
# Man-page generation harness (examples/man_pages.rs + tests); kept out of
# the shipped binary.
clap_mangen = { workspace = true }
# The exit-code mapping test constructs typed capture /
# export errors (the permission-denied class downcast chain).
flowshot-capture = { path = "../flowshot-capture" }
flowshot-actions = { path = "../flowshot-actions" }
proptest = { workspace = true }
serde = { workspace = true }
# The session-dispatch regression test parses the child's result JSON.
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "flowshot"
maintainer = "FlowOSS <https://github.com/FlowOSS>"
copyright = "2026 FlowShot Contributors"
license-file = ["../../LICENSE", "4"]
extended-description = """
Screenshot and annotation tool for modern Linux desktops.
Native on Wayland (ext-image-copy-capture, wlr-screencopy, KWin D-Bus, portal)
and X11 (MIT-SHM fast path), physical-pixels-first geometry, rich annotation
editor with step counters, secure pixelation, pins, and tray host.
"""
depends = "$auto, libpipewire-0.3-0, hicolor-icon-theme"
recommends = "xdg-desktop-portal"
section = "graphics"
priority = "optional"
assets = [
    ["../../target/release/flowshot", "usr/bin/flowshot", "755"],
    ["../../target/release/flowshot-daemon", "usr/bin/flowshot-daemon", "755"],
    ["../../packaging/flowshot.desktop.in", "usr/share/applications/org.flowoss.FlowShot.desktop", "644"],
    ["../../assets/logo.svg", "usr/share/icons/hicolor/scalable/apps/org.flowoss.FlowShot.svg", "644"],
    ["../../target/debian-assets/icons/48.png", "usr/share/icons/hicolor/48x48/apps/org.flowoss.FlowShot.png", "644"],
    ["../../target/debian-assets/icons/64.png", "usr/share/icons/hicolor/64x64/apps/org.flowoss.FlowShot.png", "644"],
    ["../../target/debian-assets/icons/128.png", "usr/share/icons/hicolor/128x128/apps/org.flowoss.FlowShot.png", "644"],
    ["../../target/debian-assets/icons/256.png", "usr/share/icons/hicolor/256x256/apps/org.flowoss.FlowShot.png", "644"],
    ["../../target/debian-assets/icons/512.png", "usr/share/icons/hicolor/512x512/apps/org.flowoss.FlowShot.png", "644"],
    ["../../target/debian-assets/man/flowshot.1", "usr/share/man/man1/flowshot.1", "644"],
    ["../../target/debian-assets/man/flowshot-config.5", "usr/share/man/man5/flowshot-config.5", "644"],
    ["../../target/debian-assets/completions/flowshot.bash", "usr/share/bash-completion/completions/flowshot", "644"],
    ["../../target/debian-assets/completions/_flowshot", "usr/share/zsh/site-functions/_flowshot", "644"],
    ["../../target/debian-assets/completions/flowshot.fish", "usr/share/fish/vendor_completions.d/flowshot.fish", "644"],
]

[target.'cfg(unix)'.dependencies]
# The exit-code table downcasts the capture error chain for the
# protocol permission refusal (IccError::PermissionDenied -> exit 5).
flowshot-capture-wayland = { path = "../flowshot-capture-wayland" }
