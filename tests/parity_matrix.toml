# FlowShot parity matrix (plan todo 38, Metis #18).
#
# Enumerates EVERY draft-F12 inventory item (.omo/drafts/flowshot.md F12,
# Flameshot lane-1 commit 2d478061) with exactly one disposition per row:
#   - implemented_by (todo numbers) + verified_by (evidence paths and/or
#     `test:<filter>` tokens run by the workspace suite), OR
#   - out = "<REASON>" (e.g. DROPPED(user-amendment-3): ...), OR
#   - capability_row = "<id>" for CLI-domain rows, REFERENCING
#     crates/flowshot-cli/tests/cli_capability_map.toml instead of
#     duplicating dispositions (Momus r4 SIMPLIFY: single source of truth
#     per domain).
# ZERO unmapped rows; the validator (crates/flowshot-cli/tests/
# parity_matrix.rs) runs in CI via `cargo test --workspace`.
#
# Row grammar: id (unique, kebab-case), domain, item (F12 wording), then
# exactly one disposition shape. verified_by entries that look like repo
# paths are existence-checked by the validator.

[meta]
plan = ".omo/plans/flowshot.md"
draft = ".omo/drafts/flowshot.md"
cli_capability_map = "crates/flowshot-cli/tests/cli_capability_map.toml"
type_enum_source = "flameshot src/tools/capturetool.h @ 2d478061 (TYPE_* 0..24, 7 unassigned)"

