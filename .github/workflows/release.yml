# Tag-triggered release pipeline.
#
# Shape: meta (version guard) -> changelog + gate + build-linux + package-arch
# -> release (draft, attest, validate, publish) -> sentry-release (gated).
# Every distributed artifact is built in a pinned container - never on
# ubuntu-latest directly, whose floor keeps moving (26.04 = glibc 2.43 lands
# Nov 2026). The build container is ubuntu:24.04 (noble): glibc 2.39 floor
# (Ubuntu 24.04+, Debian 13+, Fedora 40+, Arch). It CANNOT be jammy (22.04,
# glibc 2.35) despite the wider reach: libspa 0.10.1 bindgens against the
# host SPA headers and jammy's pipewire 0.3.48 lacks the fields/symbols the
# crate requires (spa_video_info_raw.flags, u64 modifier,
# spa_meta_region_is_valid) - verified by CI builds;
# noble's pipewire 1.0.5 compiles clean (ci.yml proves it daily). A
# jammy+backported-headers build could reclaim the 2.35 floor later with a
# symbol audit; not worth the risk for v0.1.0.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+']
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      arch_version: ${{ steps.meta.outputs.arch_version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "push" ]]; then
            # Rehearsal via workflow_dispatch: prerelease-shaped version.
            version="0.0.0-$(date +%s)"
          else
            tag="${GITHUB_REF_NAME}"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]] || {
              echo "bad tag shape: $tag" >&2; exit 1; }
            version="${tag#v}"
            toml_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            if [[ "$toml_version" != "$version" ]]; then
              echo "tag/version drift: tag=$version workspace Cargo.toml=$toml_version" >&2
              exit 1
            fi
          fi
          # Arch pkgver forbids hyphens (prerelease/rehearsal shapes carry
          # one): the Arch package and its asset name use the dotted form.
          # Identical to version for stable tags.
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arch_version=${version//-/.}" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "is_prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "is_prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  changelog:
    needs: meta
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: git-cliff grouping AND the Sentry set-commits
          # contract both need it (shallow checkouts silently attach nothing).
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - run: |
          set -euo pipefail
          git cliff --tag "v${{ needs.meta.outputs.version }}" --strip header -o release-notes.md
          git cliff --tag "v${{ needs.meta.outputs.version }}" -o CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: |
            release-notes.md
            CHANGELOG.md
          if-no-files-found: error

  gate:
    needs: meta
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Base deps
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang libclang-dev pkg-config libpipewire-0.3-dev \
            curl git ca-certificates jq
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: ./scripts/purity-gate.sh
      - run: cargo fmt -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2

  build-linux:
    needs: meta
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Base deps
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang libclang-dev pkg-config libpipewire-0.3-dev \
            curl git ca-certificates jq binutils xz-utils \
            desktop-file-utils librsvg2-bin
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Build (release, locked)
        run: cargo build --release --locked -p flowshot-cli -p flowshot-daemon
      - name: Assert no OpenSSL linkage (stale-graph guard)
        run: |
          set -euo pipefail
          for b in target/release/flowshot target/release/flowshot-daemon; do
            # if/then, not `grep && {}`: a non-matching grep as the script's
            # last command would make the good path exit 1.
            if readelf -d "$b" | grep -qE 'libssl|libcrypto'; then
              echo "$b links OpenSSL - the graph is rustls-only; refusing to ship" >&2
              exit 1
            fi
          done
      - name: Split debug companions (ship stripped, archive the .d files)
        run: |
          set -euo pipefail
          mkdir -p dist debug-archive
          for b in flowshot flowshot-daemon; do
            objcopy --only-keep-debug "target/release/$b" "debug-archive/$b.d"
            objcopy --strip-debug --strip-unneeded "target/release/$b" "dist/$b"
            objcopy --add-gnu-debuglink="debug-archive/$b.d" "dist/$b"
            readelf -n "dist/$b" | grep -qi 'build id' || {
              echo "$b: missing NT_GNU_BUILD_ID (Sentry DIF prerequisite)" >&2
              exit 1; }
          done
      - name: Stage the FHS prefix tree
        run: |
          set -euo pipefail
          VER="${{ needs.meta.outputs.version }}"
          STAGE="stage/flowshot-$VER"
          mkdir -p "$STAGE/usr/bin" "$STAGE/usr/share/man" \
                   "$STAGE/usr/share/applications" \
                   "$STAGE/usr/share/doc/flowshot" \
                   "$STAGE/usr/share/icons/hicolor/scalable/apps"
          for s in 48 64 128 256 512; do
            mkdir -p "$STAGE/usr/share/icons/hicolor/${s}x${s}/apps"
            rsvg-convert -w "$s" -h "$s" assets/logo.svg \
              -o "$STAGE/usr/share/icons/hicolor/${s}x${s}/apps/org.flowoss.FlowShot.png"
          done
          cp assets/logo.svg "$STAGE/usr/share/icons/hicolor/scalable/apps/org.flowoss.FlowShot.svg"
          install -m755 dist/flowshot dist/flowshot-daemon "$STAGE/usr/bin/"
          cp packaging/flowshot.desktop.in "$STAGE/usr/share/applications/org.flowoss.FlowShot.desktop"
          desktop-file-validate "$STAGE/usr/share/applications/org.flowoss.FlowShot.desktop"
          # The example writes pages FLAT into the given dir; sort them into
          # the FHS man1/man5 sections (same split the Arch recipe does).
          MANTMP="$(mktemp -d)"
          cargo run --release --locked -p flowshot-cli --example man_pages -- "$MANTMP"
          mkdir -p "$STAGE/usr/share/man/man1" "$STAGE/usr/share/man/man5"
          install -m644 "$MANTMP"/*.1 -t "$STAGE/usr/share/man/man1/"
          install -m644 "$MANTMP"/*.5 -t "$STAGE/usr/share/man/man5/"
          rm -rf "$MANTMP"
          gzip -9 "$STAGE"/usr/share/man/man1/*.1 "$STAGE"/usr/share/man/man5/*.5
          mkdir -p "$STAGE/usr/share/bash-completion/completions" \
                   "$STAGE/usr/share/zsh/site-functions" \
                   "$STAGE/usr/share/fish/vendor_completions.d" \
                   "$STAGE/usr/share/elvish/lib" \
                   "$STAGE/usr/share/powershell" \
                   "$STAGE/completions/nushell"
          export RUST_LOG=error
          "$STAGE/usr/bin/flowshot" completions bash       > "$STAGE/usr/share/bash-completion/completions/flowshot"
          "$STAGE/usr/bin/flowshot" completions zsh        > "$STAGE/usr/share/zsh/site-functions/_flowshot"
          "$STAGE/usr/bin/flowshot" completions fish       > "$STAGE/usr/share/fish/vendor_completions.d/flowshot.fish"
          "$STAGE/usr/bin/flowshot" completions elvish     > "$STAGE/usr/share/elvish/lib/flowshot.elv"
          # The clap enum value is `pwsh`, not `powershell`.
          "$STAGE/usr/bin/flowshot" completions pwsh       > "$STAGE/usr/share/powershell/flowshot.ps1"
          "$STAGE/usr/bin/flowshot" completions nushell    > "$STAGE/completions/nushell/flowshot.nu"
          cp LICENSE NOTICES README.md "$STAGE/usr/share/doc/flowshot/"
          tar -C stage -cJf "flowshot-$VER-x86_64-unknown-linux-gnu.tar.xz" "flowshot-$VER"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: flowshot-*-x86_64-unknown-linux-gnu.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: flowshot-*-x86_64-unknown-linux-gnu.tar.xz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: debug-companions
          path: debug-archive/
          # Retention is the point: these are the only artifacts that make
          # Sentry file:line symbolication retroactively enable-able.
          retention-days: 365
          if-no-files-found: error

  package-arch:
    needs: meta
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Base deps
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel cargo clang desktop-file-utils git librsvg pipewire \
            pkgconf ttf-dejavu pacman-contrib namcap
          useradd -m builder
          # makepkg --syncdeps shells out to `sudo pacman`; NOPASSWD keeps the
          # container build unattended (the deps are pre-installed above, so
          # syncdeps is a verification pass here, not the installer).
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Render the internal recipe (pkgver + tag hash + checksums)
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VER="${{ needs.meta.outputs.version }}"
          ARCH_VER="${{ needs.meta.outputs.arch_version }}"
          cp -a packaging/arch /work-pkg
          chown -R builder:builder /work-pkg "$GITHUB_WORKSPACE"
          cd /work-pkg
          sed -i "s/^pkgver=.*/pkgver=$ARCH_VER/" PKGBUILD
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag_ref="$(git -C "$GITHUB_WORKSPACE" rev-parse "v$VER^{commit}")"
          else
            # Rehearsal (workflow_dispatch): no tag exists; build the checked-out HEAD.
            tag_ref="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          fi
          sed -i "s|^_tag=.*|_tag=$tag_ref|" PKGBUILD
          sudo -u builder updpkgsums
          if grep -q "b2sums=('SKIP')" PKGBUILD; then
            echo "checksums still SKIP" >&2; exit 1
          fi
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
      - name: Build the Arch package (full makepkg incl. check())
        run: sudo -u builder PACKAGER='FlowOSS <https://github.com/FlowOSS>' bash -c 'cd /work-pkg && makepkg --syncdeps --noconfirm'
      - name: namcap + content assertions
        run: |
          set -euo pipefail
          cd /work-pkg
          # Rename FIRST (makepkg's own naming cannot carry the -Arch distro
          # marker): every later step - namcap, assertions, collection,
          # attestation - works on the published asset name.
          ARCH_VER="${{ needs.meta.outputs.arch_version }}"
          mv "flowoss-flowshot-$ARCH_VER-1-x86_64.pkg.tar.zst" \
             "flowoss-flowshot-$ARCH_VER-1-x86_64-Arch.pkg.tar.zst"
          PKG="flowoss-flowshot-$ARCH_VER-1-x86_64-Arch.pkg.tar.zst"
          namcap PKGBUILD
          namcap "$PKG"
          # The official archlinux image NoExtracts usr/share/{man,doc}: assert
          # package CONTENTS, never the installed filesystem. File-based grep:
          # `pacman -Qpl | grep -q` SIGPIPEs under pipefail (exit 141) when
          # grep exits on first match.
          pacman -Qpl "$PKG" > /tmp/pkglist
          grep -q 'usr/bin/flowshot$' /tmp/pkglist
          grep -q 'usr/share/man/man1/flowshot.1' /tmp/pkglist
      - name: Collect asset
        run: |
          set -euo pipefail
          # Explicit name (never a glob): a debug split package must not leak
          # into the release assets even if one is ever produced.
          cp "/work-pkg/flowoss-flowshot-${{ needs.meta.outputs.arch_version }}-1-x86_64-Arch.pkg.tar.zst" .
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: flowoss-flowshot-*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: flowoss-flowshot-*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: [meta, changelog, gate, build-linux, package-arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Checksums
        run: |
          set -euo pipefail
          # Flat filenames in the sums file: users download assets side by
          # side, so `sha256sum -c` must work in a flat directory.
          (cd tarball && sha256sum *.tar.xz) > sha256sums.txt
          (cd arch-package && sha256sum *.pkg.tar.zst) >> sha256sums.txt
          (cd tarball && sha256sum -c ../sha256sums.txt --ignore-missing)
          (cd arch-package && sha256sum -c ../sha256sums.txt --ignore-missing)
      # Rehearsal mode (workflow_dispatch): publish NOTHING - no draft release,
      # no tag - just expose every built artifact for inspection.
      - name: Rehearsal - upload all artifacts, skip publishing
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-artifacts
          path: |
            tarball/
            arch-package/
            changelog/
            sha256sums.txt
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          body_path: changelog/release-notes.md
          draft: true
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            tarball/*.tar.xz
            arch-package/*.pkg.tar.zst
            sha256sums.txt
            changelog/CHANGELOG.md
      - name: Validate the published asset list, then undraft
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VER="${{ needs.meta.outputs.version }}"
          ARCH_VER="${{ needs.meta.outputs.arch_version }}"
          # -R is required: this job never checks the repo out, and gh cannot
          # resolve the repository from a non-git working directory.
          assets="$(gh release view "v$VER" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for want in "flowshot-$VER-x86_64-unknown-linux-gnu.tar.xz" \
                      "flowoss-flowshot-$ARCH_VER-1-x86_64-Arch.pkg.tar.zst" \
                      "sha256sums.txt" "CHANGELOG.md"; do
            echo "$assets" | grep -qx "$want" || {
              echo "missing expected asset: $want" >&2; exit 1; }
          done
          gh release edit "v$VER" -R "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

  sentry-release:
    needs: [meta, release]
    # Never announce a rehearsal version: real tags only, and only when the
    # integration is enabled (vars + token).
    if: github.event_name == 'push' && vars.SENTRY_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned sentry-cli
        run: |
          set -euo pipefail
          # 3.8.0 verified against the instance (self-hosted 26.3.1 >= the
          # 24.11.1 floor). NOT getsentry/action-release: it bundles CLI
          # ^2.58.6 (predates the self-hosted fixes) and defaults the release
          # name to the GitHub SHA. Pinning is Sentry's own recommendation.
          curl -sL https://sentry.io/get-cli/ | SENTRY_CLI_VERSION="3.8.0" sh
      - name: Announce the release
        env:
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          # Byte-identical to the SDK's RELEASE const
          # (concat!("flowshot@", CARGO_PKG_VERSION) in telemetry/mod.rs) -
          # any drift silently orphans events into a second release.
          VERSION="flowshot@${{ needs.meta.outputs.version }}"
          sentry-cli info
          sentry-cli releases new "$VERSION" -p "$SENTRY_PROJECT"
          sentry-cli releases set-commits "$VERSION" --auto --ignore-missing
          sentry-cli releases finalize "$VERSION"
          sentry-cli deploys new --release "$VERSION" -e production
          sentry-cli releases info "$VERSION"
