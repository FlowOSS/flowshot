name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libspa-sys (via the pipewire crate, portal ScreenCast capture) pkg-configs
      # libpipewire-0.3 at build time; slimmed runner images no longer ship the
      # headers. The other system-library wall (glib-sys via dead rfd) was removed
      # from the graph instead - see commit 1301d33.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Platform purity gate (todo 42)
        run: ./scripts/purity-gate.sh
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Check clippy
        run: cargo clippy -- -D warnings
      - name: Run tests
        run: cargo test
      - name: Check dependencies
        run: cargo deny check