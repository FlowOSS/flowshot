name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libspa-sys (via the pipewire crate, portal ScreenCast capture) pkg-configs
      # libpipewire-0.3 at build time; slimmed runner images no longer ship the
      # headers. The other system-library wall (glib-sys via dead rfd) was removed
      # from the graph instead - see commit 1301d33.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev clang mold
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Platform purity gate
        run: ./scripts/purity-gate.sh
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Check clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test
      - name: Check dependencies
        # cargo-deny is not preinstalled on the runner (the previous bare
        # `cargo deny check` step could never have run - every earlier run
        # died in the compile phase first); the official action mirrors the
        # local `just deny` gate.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check clippy (Windows)
        run: cargo clippy -p flowshot-core -p flowshot-capture -p flowshot-capture-windows -p flowshot-ui -p flowshot-actions -p flowshot-daemon -p flowshot-cli --lib --bins --tests -- -D warnings
      - name: Run tests (Windows)
        run: cargo test -p flowshot-core -p flowshot-capture -p flowshot-capture-windows -p flowshot-ui -p flowshot-actions -p flowshot-daemon -p flowshot-cli --lib --bins --tests
      - name: Build Windows release binaries
        run: cargo build -p flowshot-cli -p flowshot-daemon --release
