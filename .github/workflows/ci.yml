name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Check clippy
        run: cargo clippy -- -D warnings
      - name: Run tests
        run: cargo test
      - name: Check dependencies
        run: cargo deny check