# git-cliff configuration — FlowShot release notes.
# The repo already uses Conventional Commits, so grouping is mechanical.
# Usage: git cliff --tag vX.Y.Z --strip header   (release body)
#        git cliff --tag vX.Y.Z                  (full CHANGELOG.md)

[changelog]
# A per-release body: no header (the release page provides context).
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {{ commit.message | split(pat="\\n") | first | trim }}\
{%- if commit.remote.pr_number %} ({{ commit.remote.pr_number }}){% endif %}
{% endfor %}\
{% endfor %}\
{% if version %}
### Artifacts

| Platform | Package | Description |
|---|---|---|
| **Windows** (Installer) | `flowshot-setup-{{ version | trim_start_matches(pat="v") }}-x86_64.exe` | **Recommended**. Windows setup wizard with Start Menu integration and optional startup |
| **Windows** (Portable) | `flowshot-{{ version | trim_start_matches(pat="v") }}-windows-x86_64.zip` | Standalone portable archive without installer (not recommended for daily use) |
| **Debian / Ubuntu** | `flowshot_{{ version | trim_start_matches(pat="v") }}-1_amd64.deb` | Native package for Debian, Ubuntu, and Linux Mint (`sudo apt install ./...`) |
| **Arch Linux** | `flowshot-{{ version | trim_start_matches(pat="v") }}-1-x86_64-Arch.pkg.tar.zst` | Native pacman package; also available on the AUR as `flowshot-bin` (e.g. `paru -S flowshot-bin`) |
| **Linux (Generic)** | `flowshot-{{ version | trim_start_matches(pat="v") }}-x86_64-unknown-linux-gnu.tar.xz` | Standalone portable binary archive for all other 64-bit Linux distributions |
{% endif %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Drop non-conventional commits (merge commits etc.) instead of erroring.
filter_unconventional = true
split_commits = false
commit_preprocessors = [{ pattern = '  +', replace = ' ' }]
commit_parsers = [
  { message = '^feat', group = 'Added' },
  { message = '^fix', group = 'Fixed' },
  { message = '^perf', group = 'Performance' },
  { message = '^refactor', group = 'Changed' },
  { message = '^docs', group = 'Documentation' },
  { message = '^test', group = 'Testing' },
  { message = '^(build|ci)', group = 'Build/CI' },
  { message = '^chore\\(release\\)', skip = true },
  { message = '^chore\\(deps\\)', skip = true },
  { message = '^chore', group = 'Chores' },
  { message = '^revert', group = 'Reverted' },
]
filter_commits = false
tag_pattern = 'v[0-9]*'
sort_commits = 'oldest'
