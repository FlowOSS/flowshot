[workspace]
members = [
    "crates/flowshot-core",
    "crates/flowshot-capture",
    "crates/flowshot-capture-wayland",
    "crates/flowshot-ui",
    "crates/flowshot-actions",
    "crates/flowshot-cli",
    "crates/flowshot-daemon",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/flowoss/flowshot"
authors = ["FlowShot Contributors"]
version = "0.1.0"

[workspace.dependencies]
# Core
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.19"
chrono = "0.4.38"
thiserror = "2.0.3"
anyhow = "1.0.86"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
bytes = "1.7.1"

# Async
async-trait = "0.1.92"
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = "0.7.11"
futures = "0.3.30"
parking_lot = "0.12.3"

# Image
image = "0.25.2"
fast_image_resize = "2.0.0"

# Graphics and UI
winit = "0.30.10"
wgpu = "0.20.1"
cosmic-text = "0.19.0"
glyphon = "0.6.0"
lyon = "1.0.19"
egui = "0.28.1"
egui-winit = "0.28.1"
egui-wgpu = "0.28.1"

# Wayland
wayland-client = "0.31.1"
wayland-protocols = { version = "0.32.13", features = [
    "client",
    "unstable",
    "staging",
] }
wayland-protocols-wlr = "0.3.12"
calloop = "0.13.0"
calloop-wayland-source = "0.3.0"
wl-clipboard-rs = "0.9.3"

# Portal / D-Bus
ashpd = "0.10.0"
zbus = "4.3.1"

# Notifications
notify-rust = "4.18.0"

# CLI
clap = { version = "4.5.16", features = ["derive"] }
clap_complete = "4.5.16"
clap_complete_nushell = "4.5.16"

# HTTP
reqwest = { version = "0.12.5", features = ["json"] }

# File dialogs
rfd = "0.12.1"

# Font
fontconfig = "0.6.0"

# System
nix = { version = "0.29.0", features = ["fs", "poll"] }

# Testing
proptest = "1.5.0"
wiremock = "0.6.2"

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
